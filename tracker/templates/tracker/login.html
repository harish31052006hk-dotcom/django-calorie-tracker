{% extends 'tracker/base.html' %}
{% load static %}

{% block title %}Sign In - NutriPulse Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card-custom">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                    <i class="bi bi-activity"></i>
                </div>
                <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
                <p class="text-secondary small">Log in to track your meals and hit your goals</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn-primary-custom w-100 py-2 mb-3">
                    Sign In
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-10">
                <small class="text-secondary">Don't have an account yet? 
                    <a href="{% url 'tracker:register' %}" class="text-primary text-decoration-none fw-semibold">Sign Up</a>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
